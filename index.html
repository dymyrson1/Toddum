<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблиця замовлень</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Таблиця замовлень</h1>

  <div class="controls">
    <button id="previousWeekBtn">← Попередній тиждень</button>
    <strong id="weekText">Тиждень 1</strong>
    <button id="nextWeekBtn">Наступний тиждень →</button>
  </div>

  <div class="controls">
    <button id="lockBtn" title="Розблокувати редагування">🔒</button>
    <button id="saveBtn" style="display:none;">Зберегти</button>
  </div>

  <div class="table-wrapper">
    <table id="orderTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
